# O WORKER DAS ENCOMENDAS DA FRANJA KIDS (docs/ENCOMENDAS.md, §7).
#
# Corre-se SEMPRE com --config apontado a este ficheiro (memória wrangler-autoconfig-pasta-mae: da
# pasta-mãe sem config, o wrangler inventa um Worker com o conteúdo de outro projecto; e na raiz do
# repositório há outro, o wrangler.jsonc do franjakids-site). O wrangler está instalado na
# mimices-painel:
#   ~/Websites/mimices-painel/node_modules/.bin/wrangler deploy --config ~/Websites/franjakids/worker/encomendas/wrangler.toml
#
# O index.js importa as regras do site (../../src/lib/regras.mjs): o wrangler junta-as no pacote.
# Publica-se da cópia do repositório que tem o regras.mjs que o site publicado usa.
name = "franjakids-encomendas"
main = "index.js"
compatibility_date = "2026-09-01"

[observability]
enabled = true

# As encomendas (encomenda.js diz as chaves). O título na Cloudflare é «franjakids-encomendas-ORDERS»
# (o «ORDERS» sem prefixo é o do Armazém dos Pneus, o «lfmobile-encomendas-ORDERS» é o da LF Mobile).
# Criado a 10 nov 2026 com `wrangler kv namespace create franjakids-encomendas-ORDERS`.
[[kv_namespaces]]
binding = "ORDERS"
id = "3afbbc5cd6fd441c8584df75faeafb2c"

# O travão do /checkout que vale em TODAS as localizações da Cloudflare (o de memória, em index.js,
# só vale no seu isolate): 5 pedidos por minuto por IP. O namespace_id é único na conta: 1001 e 1002
# são do Carimbo, 1101 do Armazém dos Pneus, 1102 da LF Mobile.
[[ratelimits]]
name = "TRAVAO_CHECKOUT"
namespace_id = "1103"
simple = { limit = 5, period = 60 }

# Os emails das encomendas pela Cloudflare (Email Sending: o domínio franjakids.com está nele desde 10 nov
# 2026, com os registos no cf-bounce e o DMARC; a conta está no Workers Paid, que deixa mandar a qualquer
# pessoa — 3000 por mês incluídos na conta). Só sai de encomendas@franjakids.com.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["encomendas@franjakids.com"]

[vars]
# O site no domínio (franjakids.com, desde 10 nov 2026). O catálogo vem de SITE_URL/assets/catalogo.json
# (CATALOGO_URL só se for outro sítio). Este Worker vive no workers.dev, fora da zona: lê o site do
# domínio sem a restrição dos pedidos entre Workers da mesma zona (memória worker-na-mesma-zona).
SITE_URL = "https://franjakids.com"
# O logótipo no topo dos emails: o PNG do site (o Outlook não mostra WebP).
LOGO_URL = "https://franjakids.com/assets/marca/logotipo-320.png"
# As origens que podem chamar /checkout e /encomenda: o domínio e o build local (127.0.0.1:8985 e
# localhost:8985, para os testes no Mac).
ALLOWED_ORIGINS = "https://franjakids.com,http://127.0.0.1:8985,http://localhost:8985"
STORE_NAME = "Franja Kids"
# A conta do Instagram (sem @): é o contacto dos emails (https://ig.me/m/<conta>).
STORE_INSTAGRAM = "franjakids"
# O email da loja: recebe «Nova encomenda», «Encomenda paga» e os falhados, e é o reply-to dos
# emails ao cliente. Vazio enquanto a cliente não o der — e sem ele não se manda nada à loja.
STORE_EMAIL = ""
# O remetente (o binding EMAIL só deixa este endereço; o Resend, se um dia voltar, teria de ter o
# domínio verificado).
MAIL_FROM = "Franja Kids <encomendas@franjakids.com>"
# A versão da API da Stripe, fixada (a mesma do Armazém dos Pneus e da LF Mobile). Não subir sem ler
# o changelog: o ui_mode «hosted_page» é desta versão.
STRIPE_API_VERSION = "2026-07-29.dahlia"
# MODO = "encomenda" força o modo «encomenda» mesmo com o catálogo em «online» (travão de
# emergência). Por omissão não está definido: vale o catálogo.

# ---------------------------------------------------------------------------------------------
# SEGREDOS — nunca aqui (o repositório é público). Instalar com, por exemplo:
#   < ~/Websites/franjakids/_cliente/segredos/PAINEL_SEGREDO wrangler secret put PAINEL_SEGREDO --config …
#   PAINEL_SEGREDO        o mesmo do Worker do painel (openssl rand -hex 32)
#   STRIPE_SECRET_KEY     rk_live_… da conta da cliente (quando a houver)
#   STRIPE_WEBHOOK_SECRET whsec_… do endpoint /stripe/webhook
#   RESEND_API_KEY        re_… da conta do Resend com o domínio verificado
# ---------------------------------------------------------------------------------------------
